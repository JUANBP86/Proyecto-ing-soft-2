{% extends 'base.html' %}
{% block title %}Iniciar sesión — PoliRestaurante{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shop fs-1 text-warning"></i>
          <h4 class="mt-2 fw-bold">PoliRestaurante</h4>
          <p class="text-muted small">Sistema de Gestión de Pedidos</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="usuario@ejemplo.com" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
