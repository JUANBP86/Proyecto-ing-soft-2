{% extends 'base.html' %}
{% block title %}Dashboard — Admin{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-speedometer2"></i> Dashboard</h4>

<div class="row g-4 mb-4">
  <div class="col-sm-4">
    <div class="card text-bg-warning shadow-sm">
      <div class="card-body d-flex align-items-center gap-3">
        <i class="bi bi-receipt fs-1"></i>
        <div>
          <div class="fs-2 fw-bold">{{ total_pedidos }}</div>
          <div class="small">Pedidos totales</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-4">
    <div class="card text-bg-primary text-white shadow-sm">
      <div class="card-body d-flex align-items-center gap-3">
        <i class="bi bi-calendar-day fs-1"></i>
        <div>
          <div class="fs-2 fw-bold">{{ pedidos_hoy }}</div>
          <div class="small">Pedidos hoy</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-4">
    <div class="card text-bg-success text-white shadow-sm">
      <div class="card-body d-flex align-items-center gap-3">
        <i class="bi bi-fire fs-1"></i>
        <div>
          <div class="fs-2 fw-bold">{{ pedidos_activos }}</div>
          <div class="small">En curso ahora</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row g-4">
  <div class="col-md-4">
    <a href="{{ url_for('admin.usuarios') }}" class="card text-decoration-none text-dark shadow-sm">
      <div class="card-body text-center py-4">
        <i class="bi bi-people fs-1 text-primary"></i>
        <p class="mt-2 mb-0 fw-semibold">Gestionar Usuarios</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{{ url_for('admin.productos') }}" class="card text-decoration-none text-dark shadow-sm">
      <div class="card-body text-center py-4">
        <i class="bi bi-basket fs-1 text-warning"></i>
        <p class="mt-2 mb-0 fw-semibold">Gestionar Productos</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{{ url_for('admin.mesas') }}" class="card text-decoration-none text-dark shadow-sm">
      <div class="card-body text-center py-4">
        <i class="bi bi-grid-3x3 fs-1 text-success"></i>
        <p class="mt-2 mb-0 fw-semibold">Gestionar Mesas</p>
      </div>
    </a>
  </div>
</div>
{% endblock %}
