{% extends 'base.html' %}
{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-bold">
        <i class="bi bi-plus-circle"></i> Nuevo producto
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control" name="descripcion"
                   placeholder="Descripción breve (opcional)">
          </div>
          <div class="mb-3">
            <label class="form-label">Precio</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" name="precio"
                     step="0.01" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" name="categoria_id" required>
              <option value="">— Seleccionar —</option>
              {% for cat in categorias %}
              <option value="{{ cat.id }}">{{ cat.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" name="disponible"
                   id="disponible" checked>
            <label class="form-check-label" for="disponible">Disponible en el menú</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning flex-fill">Guardar producto</button>
            <a href="{{ url_for('admin.productos') }}" class="btn btn-outline-secondary flex-fill">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
